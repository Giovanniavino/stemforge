name: Prepara l'ambiente StemForge
description: >
  Python giusto per il profilo, venv installato dal lock con gli hash e
  senza mai compilare (--only-binary), piu' gli strumenti di build.
  Esporta STEMFORGE_PY (il python del venv) per gli step successivi.
  Funziona su macOS, Windows, Ubuntu e dentro il container manylinux_2_28.

inputs:
  python:
    description: Versione di Python (3.11 per legacy-intel, 3.12 altrove)
    required: true
  lock:
    description: File di lock del profilo
    required: true
  forbid-pyav:
    description: >
      "true" nella release: PyAV nell'ambiente fa fallire il job, perche'
      il suo FFmpeg e' GPLv3 (D9). Altrove e' solo un avviso.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # macOS: il Python ufficiale di python.org, compilato per macOS 10.9+.
    # Quello preinstallato sui runner puo' richiedere un macOS recente, e
    # PyInstaller porta la sua libpython dentro l'app: l'app erediterebbe
    # quel minimo e non partirebbe sui Mac piu' vecchi (§9.1).
    - name: Python ufficiale (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        PY_SERIES: ${{ inputs.python }}
      run: |
        # 3.11.9 e 3.12.10: le ultime patch con installer binario
        case "$PY_SERIES" in
          3.11) full=3.11.9 ;;
          3.12) full=3.12.10 ;;
          *) echo "python non previsto: $PY_SERIES" >&2; exit 1 ;;
        esac
        curl -fsSL --retry 3 "https://www.python.org/ftp/python/$full/python-$full-macos11.pkg" -o "$RUNNER_TEMP/python.pkg"
        sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
        echo "BASE_PY=/Library/Frameworks/Python.framework/Versions/$PY_SERIES/bin/python$PY_SERIES" >> "$GITHUB_ENV"

    # Dentro quay.io/pypa/manylinux_2_28 (release Linux): i Python stanno
    # in /opt/python e sono quelli con cui si costruisce l'AppImage
    # (glibc 2.28, §9.8). setup-python li ignorerebbe.
    - name: Python (manylinux)
      id: manylinux
      if: runner.os == 'Linux'
      shell: bash
      env:
        PY_SERIES: ${{ inputs.python }}
      run: |
        tag="cp${PY_SERIES/./}-cp${PY_SERIES/./}"
        if [ -x "/opt/python/$tag/bin/python$PY_SERIES" ]; then
          echo "BASE_PY=/opt/python/$tag/bin/python$PY_SERIES" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Python (Windows, Ubuntu)
      if: runner.os == 'Windows' || (runner.os == 'Linux' && steps.manylinux.outputs.found != 'true')
      id: setup
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python }}

    - name: Python base (Windows, Ubuntu)
      if: steps.setup.outcome == 'success'
      shell: bash
      # command -v da' un percorso che Git Bash sa eseguire (/c/...)
      run: echo "BASE_PY=$(command -v python)" >> "$GITHUB_ENV"

    - name: Ambiente dal lock
      shell: bash
      env:
        LOCK: ${{ inputs.lock }}
        FORBID_PYAV: ${{ inputs.forbid-pyav }}
      run: |
        [ -f "$LOCK" ] || { echo "lock assente: $LOCK" >&2; exit 1; }
        "$BASE_PY" -m venv .venv
        if [ -x .venv/bin/python ]; then
          VPY="$PWD/.venv/bin/python"
        else
          # percorso in forma Windows: lo usano anche gli step PowerShell
          VPY="$(cygpath -w "$PWD/.venv/Scripts/python.exe")"
        fi
        "$VPY" -m pip install --upgrade --quiet pip "setuptools>=77" wheel
        # Python puro pubblicato solo come sorgente (SDIST_ALLOWLIST di
        # packaging/gen_locks.py): si installa senza compilatore
        "$VPY" -m pip install --require-hashes \
          --only-binary :all: --no-binary antlr4-python3-runtime,demucs,dora-search \
          -r "$LOCK"
        "$VPY" -m pip install --no-deps --no-build-isolation -e .
        "$VPY" -m pip install -r packaging/requirements-build.txt
        "$VPY" -c "import torch, PySide6, demucs; print('torch', torch.__version__, '| PySide6', PySide6.__version__)"
        # D9: il FFmpeg di PyAV e' GPLv3. La release lo rifiuta; in ci.yml
        # solo un avviso, perche' i test di sviluppo girano anche prima
        # che i lock lo abbiano tolto.
        if "$VPY" -c "import av" 2>/dev/null; then
          if [ "$FORBID_PYAV" = "true" ]; then
            echo "::error::PyAV e' installato dal lock $LOCK: il suo FFmpeg e' GPLv3 (BUILD_SPEC D9)"
            exit 1
          fi
          echo "::warning::PyAV e' installato dal lock $LOCK: il suo FFmpeg e' GPLv3 (BUILD_SPEC D9)"
        fi
        echo "STEMFORGE_PY=$VPY" >> "$GITHUB_ENV"

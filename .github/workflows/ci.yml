name: CI

# A ogni modifica: test veloci sulle tre piattaforme + validità dei lock.
# La build completa, il collaudo dei pacchetti e i test con i modelli veri
# stanno in release.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    name: Lock installabili senza compilare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packaging/gen_locks.py --check

  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, python: "3.12", lock: requirements-windows-x64.lock }
          - { name: macos-arm64, os: macos-14, python: "3.12", lock: requirements-macos-arm64.lock }
          - { name: macos-x86_64, os: macos-15-intel, python: "3.11", lock: requirements-macos-x86_64.lock }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stemforge
        with:
          python: ${{ matrix.python }}
          lock: ${{ matrix.lock }}
      - name: Test
        shell: bash
        run: '"$STEMFORGE_PY" -m pytest tests -q'

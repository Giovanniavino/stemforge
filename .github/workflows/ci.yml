name: CI

# A ogni modifica (§9.6): test veloci sui quattro profili, validita' dei
# lock, e il motore con entrambe le pile di torch (pytest -m compat, D7).
# La build completa, il collaudo dei pacchetti e i test con i modelli veri
# stanno in release.yml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  locks:
    name: Lock installabili senza compilare
    # etichetta esplicita: ubuntu-latest cambia versione da sola (D6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: uv alla versione fissata (packaging/requirements-build.txt)
        shell: bash
        run: |
          # gen_locks.py risolve con uv; il pin vive in un posto solo
          pin="$(grep -E '^uv==' packaging/requirements-build.txt || true)"
          if [ -n "$pin" ]; then python -m pip install "$pin"; fi
      - run: python packaging/gen_locks.py --check

  test:
    name: Test ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: win-x64, os: windows-2022, python: "3.12", lock: requirements-windows-x64.lock }
          # macos-14 non e' piu' disponibile (run del 09-11-2026)
          - { profile: mac-arm64, os: macos-15, python: "3.12", lock: requirements-macos-arm64.lock }
          - { profile: legacy-intel, os: macos-15-intel, python: "3.11", lock: requirements-macos-x86_64.lock }
          - { profile: linux-x64, os: ubuntu-24.04, python: "3.12", lock: requirements-linux-x64.lock }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Librerie di sistema per Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # le stesse che l'AppImage lascia all'host (packaging/linux/host_libs.txt)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0t64 libpulse0 libasound2t64
      - uses: ./.github/actions/setup-stemforge
        with:
          python: ${{ matrix.python }}
          lock: ${{ matrix.lock }}
      - name: Test veloci (compat compreso)
        shell: bash
        run: '"$STEMFORGE_PY" -m pytest tests -q'

  compat:
    # Il motore con torch 2.2.2 E 2.10 (D7, §10.6), su Linux perche' e' il
    # runner piu' rapido. La pila legacy non viene dal lock macOS (non si
    # installa fuori dal Mac): sono le versioni dell'ambiente LEGACY del
    # dev-box, fissate in .github/compat/legacy-requirements.txt.
    name: Compat ${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stack: legacy, python: "3.11" }
          - { stack: modern, python: "3.12" }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Librerie di sistema per Qt
        # pytest raccoglie anche i test della UI prima di filtrare per marker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libopengl0 libxkbcommon0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0t64 libpulse0 libasound2t64
      - name: Python 3.11 (pila legacy)
        if: matrix.stack == 'legacy'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pila legacy (torch 2.2.2, PySide6 6.4.3, numpy 1.x, demucs 4.0.1)
        if: matrix.stack == 'legacy'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --quiet pip "setuptools>=69" wheel
          # torch +cpu dall'indice di PyTorch: quello di PyPI per Linux e'
          # la build CUDA (~2 GB) e il test non usa la GPU
          .venv/bin/python -m pip install --only-binary :all: \
            --no-binary antlr4-python3-runtime,demucs,dora-search \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r .github/compat/legacy-requirements.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          echo "STEMFORGE_PY=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Ambiente moderno dal lock
        if: matrix.stack == 'modern'
        uses: ./.github/actions/setup-stemforge
        with:
          python: ${{ matrix.python }}
          lock: requirements-linux-x64.lock
      - name: Versioni in prova
        shell: bash
        run: |
          "$STEMFORGE_PY" -c "import torch, torchaudio, numpy, demucs; print('torch', torch.__version__, '| torchaudio', torchaudio.__version__, '| numpy', numpy.__version__, '| demucs', demucs.__version__)"
      - name: pytest -m compat
        shell: bash
        run: '"$STEMFORGE_PY" -m pytest tests -q -m compat'

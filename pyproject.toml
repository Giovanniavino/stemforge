[build-system]
# >=77: prima versione che accetta license come espressione SPDX (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge"
dynamic = ["version"]
description = "Separazione stem standalone con consegna drag & drop alla DAW"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
# Due pile di librerie, scelte per piattaforma (BUILD_SPEC §2):
# - Mac Intel: ferma a torch 2.2.2, l'ultima con wheel macOS x86_64, e a
#   PySide6 6.4.3, l'ultima Qt per macOS < 11. Non alzare mai questi pin.
# - Mac Apple Silicon, Windows e Linux: torch 2.10, l'ultima serie che gira
#   su OGNI Mac Apple Silicon (macOS 11+); dalla 2.12 serve macOS 14.
#   Windows e Linux usano la stessa pila: i test del dev-box valgono
#   anche per arm64. Su Linux torch viene dall'indice CPU (tool.uv.sources).
# FFmpeg NON e' una dipendenza Python: PyAV porta un FFmpeg GPLv3, al suo
# posto un FFmpeg LGPL compilato in CI (BUILD_SPEC D9).
dependencies = [
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio==2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # ==4.0.1 e non >=: la 4.1 ha aggiunto sphn (Rust, senza wheel per mac
    # x86_64/cp311), che sul Mac forza una build con Rust+CMake (campo, 11-08-2026)
    "demucs==4.0.1",
    "soundfile>=0.12",
    # nel bundle PyInstaller mancano i certificati CA di sistema
    "certifi>=2024.2",
]

[project.optional-dependencies]
ui = [
    "PySide6==6.4.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "PySide6==6.7.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# ruff e mypy: solo controlli statici del dev-box ("make lint"), mai nell'app
dev = ["pytest>=8", "pyinstaller>=6.6", "pillow>=10", "ruff==0.17.6", "mypy==2.4.1"]

[project.scripts]
stemforge = "stemforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stemforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Solo per uv (packaging/gen_locks.py), pip lo ignora. Il torch Linux di
# PyPI e' la build CUDA (~1 GB di librerie nvidia-*): la build CPU sta
# nell'indice di PyTorch. "explicit": da quell'indice si prende SOLO cio'
# che e' elencato qui, tutto il resto viene da PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
src = ["src"]
# solo per isort: E501 e' ignorata, nessun formatter
line-length = 120

[tool.ruff.lint]
# Regole che il codice rispetta (docs/optimization/O5.md). Ignorate:
# E501 (le stringhe di translate() restano su una riga per lupdate),
# SIM105 (except esplicito col perche' accanto, §11 regola 5), SIM112
# (le variabili d'ambiente di Windows si scrivono come le scrive Windows).
select = ["E", "F", "W", "I", "B", "C4", "SIM", "PIE", "PLE"]
ignore = ["E501", "SIM105", "SIM112"]

[tool.ruff.lint.per-file-ignores]
# F811: le fixture di pytest omonime di un import; il resto sono le
# violazioni che i test avevano gia', da correggere fuori da O5
"tests/**" = ["F811", "I001", "F401", "B007", "B023", "B905", "SIM102"]

[tool.mypy]
# --strict dove il codice e' puro (model/ e la parte di engine/ senza torch
# in esecuzione); "mypy" senza argomenti controlla questi file
files = [
    "src/stemforge/model",
    "src/stemforge/engine/planner.py",
    "src/stemforge/engine/formats.py",
    "src/stemforge/engine/blocks.py",
    "src/stemforge/engine/downmix.py",
    "src/stemforge/engine/contract.py",
    "src/stemforge/engine/errors.py",
]
mypy_path = "src"
strict = true
follow_imports = "silent"

[tool.pytest.ini_options]
# Famiglie di test (BUILD_SPEC §10.6). Il giro normale esclude cio' che
# pesa; "-m <marker>" sulla riga di comando vince su quello di addopts
# (pytest usa l'ultimo -m), quindi "pytest -m slow" funziona senza toccare
# questa sezione. compat NON e' escluso: costa pochi secondi (un HTDemucs
# minuscolo, niente pesi) e deve girare a ogni push con entrambe le pile
# di torch (i compat con i pesi veri sono anche slow: restano fuori);
# e' l'unico guardiano delle API di torch fra un rilascio e l'altro.
# --strict-markers: un marker scritto male e' un errore, non
# un test che sparisce in silenzio dal giro giusto.
testpaths = ["tests"]
markers = [
    "slow: Demucs vero su CPU (invariante, sotto-modello, scalabilita'); release e settimanale",
    "compat: il motore con torch 2.2.2 e 2.10; ogni push, entrambe le pile (con pesi veri: anche slow)",
    "fuzz: Hypothesis su modello, pianificatore, protocollo, file audio estremi; su richiesta",
    "chaos: worker ucciso, disco pieno, rete che cade, file di stato corrotti; su richiesta",
    "soak: batch lunghi, brano di 29 minuti, memoria e processi monitorati; su richiesta",
    "frozen: la batteria contro l'app impacchettata (STEMFORGE_FROZEN_EXE); release",
]
addopts = "--strict-markers -m 'not slow and not fuzz and not chaos and not soak and not frozen'"

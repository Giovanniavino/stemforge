[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge"
version = "0.1.0"
description = "Separazione stem standalone con consegna drag & drop alla DAW"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # torch 2.2.2 e' l'ultima versione con wheel macOS x86_64 (BUILD_SPEC §2).
    # Non alzare mai questo pin finche' il target resta Mac Intel.
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "numpy>=1.26,<2",
    # ==4.0.1 e non >=: la 4.1 ha aggiunto la dipendenza sphn (Rust, senza
    # wheel per mac x86_64/cp311) che sul Mac target forza una build da
    # sorgente con toolchain Rust+CMake. Verificato sul campo l'11-08-2026.
    "demucs==4.0.1",
    "soundfile>=0.12",
    # nel bundle PyInstaller mancano i certificati CA di sistema: senza
    # certifi il download HTTPS dei pesi fallirebbe sul Mac dell'utente
    "certifi>=2024.2",
]

[project.optional-dependencies]
# sul target macOS 10.15 il lock pinna PySide6==6.4.3 (ultima Qt per
# macOS < 11, BUILD_SPEC §2); il range qui serve solo al dev-box
ui = ["PySide6>=6.4"]
dev = ["pytest>=8", "PySide6>=6.4", "pyinstaller>=6.6"]

[project.scripts]
stemforge = "stemforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test con modelli reali, esclusi dal giro veloce (deselect con -m 'not slow')",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge"
dynamic = ["version"]
description = "Separazione stem standalone con consegna drag & drop alla DAW"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Due pile di librerie, scelte per piattaforma (BUILD_SPEC §2):
# - Mac Intel: ferma a torch 2.2.2, l'ultima con wheel macOS x86_64, e a
#   PySide6 6.4.3, l'ultima Qt per macOS < 11. Non alzare mai questi pin.
# - Mac Apple Silicon, Windows e Linux: torch 2.10, l'ultima serie che gira
#   su OGNI Mac Apple Silicon (macOS 11+); dalla 2.12 serve macOS 14.
#   Windows e Linux usano la stessa pila: i test del dev-box valgono
#   anche per arm64. Su Linux torch viene dall'indice CPU (tool.uv.sources).
# FFmpeg NON e' una dipendenza Python: PyAV porta un FFmpeg GPLv3, al suo
# posto un FFmpeg LGPL compilato in CI (BUILD_SPEC D9).
dependencies = [
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio==2.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # ==4.0.1 e non >=: la 4.1 ha aggiunto sphn (Rust, senza wheel per mac
    # x86_64/cp311), che sul Mac forza una build con Rust+CMake (campo, 11-08-2026)
    "demucs==4.0.1",
    "soundfile>=0.12",
    # nel bundle PyInstaller mancano i certificati CA di sistema
    "certifi>=2024.2",
]

[project.optional-dependencies]
ui = [
    "PySide6==6.4.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "PySide6==6.7.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
dev = ["pytest>=8", "pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
stemforge = "stemforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "stemforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Solo per uv (packaging/gen_locks.py), pip lo ignora. Il torch Linux di
# PyPI e' la build CUDA (~1 GB di librerie nvidia-*): la build CPU sta
# nell'indice di PyTorch. "explicit": da quell'indice si prende SOLO cio'
# che e' elencato qui, tutto il resto viene da PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test con modelli reali, esclusi dal giro veloce (deselect con -m 'not slow')",
]
addopts = "-m 'not slow'"
